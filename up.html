<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wilson王朝｜16岁生日快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #000000;
            background-image: radial-gradient(#221800, #000);
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            color: #fff;
        }
        /* 气球容器 */
        .balloon-container {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .balloon {
            position: absolute;
            bottom: -120px;
            border-radius: 50%;
            animation: float 12s infinite ease-in-out;
        }
        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(-110vh) rotate(15deg);
                opacity: 0;
            }
        }
        /* 文字内容 */
        .content {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .main-title {
            font-size: clamp(2.2rem, 8vw, 5rem);
            background: linear-gradient(90deg, #ffd700, #ffb800, #ffd700);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 00, 0.4);
            margin-bottom: 30px;
            font-weight: bold;
        }
        .slogan {
            font-size: clamp(1rem, 3vw, 1.8rem);
            color: #f0e6b0;
            line-height: 2.2;
        }
        .slogan span {
            display:block;
            margin:8px 0;
        }
        /* 金色闪光装饰 */
        .shine {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffd700;
            animation: sparkle 3s infinite;
        }
        @keyframes sparkle {
            0%,100%{opacity:0;}
            50%{opacity:1;}
        }
    </style>
</head>
<body>
<div class="balloon-container" id="balloons"></div>
<div class="content">
    <h1 class="main-title">Wilson王朝<br>9.26 16岁生日快乐</h1>
    <div class="slogan">
        <span>永远不惧困难</span>
        <span>在哪儿跌倒在哪站起来</span>
        <span>永远爱自己</span>
        <span>世界和平</span>
    </div>
</div>

<script>
// 生成金/白/黑三色气球
const balloonContainer = document.getElementById("balloons");
const colors = ["#ffd700","#ffffff","#111111"];

function createBalloon(){
    const balloon = document.createElement("div");
    balloon.classList.add("balloon");
    const size = 40 + Math.random() * 90;
    const color = colors[Math.floor(Math.random()*colors.length)];
    balloon.style.width = size + "px";
    balloon.style.height = size * 1.2 + "px";
    balloon.style.background = color;
    balloon.style.left = Math.random() * 100 + "%";
    balloon.style.animationDuration = 7 + Math.random() * 10 + "s";
    balloon.style.animationDelay = Math.random() * 4 + "s";
    balloonContainer.appendChild(balloon);

    // 自动清理
    setTimeout(()=>{
        balloon.remove();
    },18000)
}

// 持续生成气球
setInterval(createBalloon, 600);

// 金色星光点缀
function createShine(){
    const shine = document.createElement("div");
    shine.classList.add("shine");
    shine.style.left = Math.random()*100+"%";
    shine.style.top = Math.random()*100+"%";
    shine.style.animationDelay = Math.random()*3+"s";
    document.body.appendChild(shine);
    setTimeout(()=>shine.remove(),3000)
}
setInterval(createShine,250);
</script>
</body>
</html>
