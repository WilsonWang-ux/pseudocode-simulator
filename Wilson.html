<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 16th Birthday Wilson</title>
    <!-- 引入Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
        body{
            background: #cce7f8;
            background-image: url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=1400');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height:100vh;
            padding:30px 15px;
        }
        .mask{
            background:rgba(255,230,245,0.65);
            position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
        }
        .container{
            position:relative;z-index:2;
            max-width:700px;margin:0 auto;text-align:center;
        }
        h1{
            font-size:48px;color:#c24e94;text-shadow: 2px 2px 4px #fff;
            margin-bottom:12px;
        }
        .sub-title{
            font-size:22px;color:#703b75;margin-bottom:40px;
        }
        .card{
            background:rgba(255,255,255,0.82);
            border-radius:20px;padding:25px;margin-bottom:30px;
            box-shadow:0 8px 24px #00000022;
        }
        textarea{
            width:100%;height:100px;padding:12px;border-radius:12px;border:1px solid #ffb7d8;
            font-size:16px;resize:none;margin-bottom:12px;outline:none;
        }
        button{
            padding:10px 24px;border:none;border-radius:10px;
            background:#f288b8;color:white;font-size:17px;cursor:pointer;
            transition:0.2s;
        }
        button:hover{background:#dd689e;}
        .msg-item{
            text-align:left;padding:12px 16px;border-bottom:1px solid #f5d7e7;
            color:#444;
        }
        .time-text{
            font-size:0.8em;color:#888;margin-top:4px;
        }
        #fireworksCanvas{
            position:fixed;top:0;left:0;width:100vw;height:100vh;
            pointer-events:none;z-index:1;
        }
    </style>
</head>
<body>
    <div class="mask"></div>
    <canvas id="fireworksCanvas"></canvas>
    <div class="container">
        <div class="card">
            <h1>王朝 Wilson 🎂</h1>
            <p class="sub-title">Happy 16th Birthday!</p>
            <p>欢迎来到我的生日小站，在这里写下你的生日祝福✨</p>
        </div>

        <div class="card">
            <h3 style="margin-bottom:15px;color:#b05488">匿名留言板</h3>
            <textarea id="msgInput" placeholder="在这里写下给Wilson的生日祝福..."></textarea>
            <button onclick="submitMessage()">提交祝福</button>
            <div id="msgList" style="margin-top:20px;"></div>
        </div>
    </div>

<script>
// ====================== 在这里填入你的Supabase信息 ======================
const SUPABASE_URL = "https://zcywplytozkwezkddswq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjeXdwbHl0b3prd2V6a2Rkc3dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NTQ5OTUsImV4cCI6MjEwNTQzMDk5NX0.C9wNne4KR2WIDnoTSmcYpC7HdwS-nYwd3t6WYZHzEx4";
// =======================================================================
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ========== 烟花代码 ==========
const canvas = document.getElementById('fireworksCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

class Particle{
    constructor(x,y,color){
        this.x = x;this.y = y;
        this.speed = Math.random()*5+2;
        this.angle = Math.random()*Math.PI*2;
        this.gravity = 0.08;
        this.vx = Math.cos(this.angle)*this.speed;
        this.vy = Math.sin(this.angle)*this.speed;
        this.alpha = 1;
        this.decay = Math.random()*0.015+0.005;
        this.color = color;
    }
    update(){
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.alpha -= this.decay;
    }
    draw(){
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x,this.y,2,0,Math.PI*2);
        ctx.fillStyle=this.color;
        ctx.fill();
        ctx.restore();
    }
}
let particles = [];
const colors = ['#ff99cc','#87cefa','#ffd700','#ff7799','#b699ff'];
function createFirework(x,y){
    for(let i=0;i<120;i++){
        const c = colors[Math.floor(Math.random()*colors.length)];
        particles.push(new Particle(x,y,c));
    }
}
setInterval(()=>{
    createFirework(Math.random()*canvas.width, Math.random()*canvas.height*0.5);
},1200);

function animate(){
    requestAnimationFrame(animate);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=particles.length-1;i>=0;i--){
        particles[i].update();
        particles[i].draw();
        if(particles[i].alpha <=0) particles.splice(i,1);
    }
}
animate();

// ========== Supabase留言逻辑 ==========

// 读取全部留言（最新的在最上面）
async function loadMessages(){
    const {data,error} = await supabase
        .from('birthday_messages')
        .select('content,created_at')
        .order('created_at',{ascending:false});
    const listDom = document.getElementById("msgList");
    listDom.innerHTML="";
    if(error){
        listDom.innerHTML="<p>加载留言失败，请检查Supabase配置</p>";
        console.error(error);
        return;
    }
    if(data.length===0){
        listDom.innerHTML="<p>还没有祝福，快来写下第一条！💌</p>";
        return;
    }
    data.forEach(item=>{
        const div = document.createElement('div');
        div.className="msg-item";
        const time = new Date(item.created_at).toLocaleString();
        div.innerHTML = `
            <div>${item.content}</div>
            <div class="time-text">${time}</div>
        `;
        listDom.appendChild(div);
    })
}

// 提交新留言
async function submitMessage(){
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if(!text){
        alert("请写下祝福内容！");
        return;
    }
    const {error} = await supabase.from('birthday_messages').insert([{content:text}]);
    if(error){
        alert("提交失败，请稍后重试");
        console.error(error);
    }else{
        alert("祝福提交成功🎉");
        input.value="";
        loadMessages();
    }
}

// 页面打开立刻加载留言
loadMessages();
</script>
</body>
</html>
